name: Rootless Kubernetes residual-authority PoC

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: rootful
            provider: docker
          - mode: rootless
            provider: podman
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Kubernetes clients
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          sudo install -m 0755 kind /usr/local/bin/kind
          curl -fsSLo kubectl https://dl.k8s.io/release/v1.36.1/bin/linux/amd64/kubectl
          sudo install -m 0755 kubectl /usr/local/bin/kubectl

      - name: Install Rootless Podman
        if: matrix.provider == 'podman'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman uidmap slirp4netns fuse-overlayfs
          podman info --format '{{.Host.Security.Rootless}}'

      - name: Run probe
        shell: bash
        env:
          POC_PROVIDER: ${{ matrix.provider }}
        run: bash scripts/run-case.sh "${{ matrix.mode }}"

      - name: Show raw result
        if: always()
        shell: bash
        run: |
          find results -maxdepth 1 -type f -print -exec sed -n '1,200p' {} \; || true

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.mode }}
          path: results/
          if-no-files-found: warn

      - name: Delete cluster
        if: always()
        shell: bash
        env:
          POC_PROVIDER: ${{ matrix.provider }}
        run: bash scripts/cleanup.sh "${{ matrix.mode }}" || true

  compare:
    needs: probe
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v5
        with:
          pattern: result-*
          path: results
          merge-multiple: true
      - name: Compare
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/compare.py results/rootful.tsv results/rootless.tsv --output results/comparison.md
          cat results/comparison.md
      - uses: actions/upload-artifact@v4
        with:
          name: comparison
          path: results/
